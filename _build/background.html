<!doctype html>
<!--
  PDF page background: US Letter, kraft paper edge, wavy green border, colored panel.
  _build/render_assets.py saves this as assets/imgs/pdf-background.png (1700 x 2200 px),
  and, opened with #trees on the end, as assets/imgs/pdf-background-gtk.png (trees version).
  Change PANEL to recolor the inside of the page. The PDF code keeps its cards and
  text inside the border, so keep the numbers under "Border shape" close to as they are.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF background</title>
<style>
html, body { margin: 0; background: #EDE6D8; }
#bg { display: block; width: 1700px; height: 2200px; }
</style>
</head>
<body>
<svg id="bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215.9 279.4" width="1700" height="2200">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="2.4" numOctaves="2" seed="11" result="fine"/>
      <feColorMatrix in="fine" type="matrix"
        values="0 0 0 0 0.52  0 0 0 0 0.43  0 0 0 0 0.30  0 0 0 1.4 -0.7"/>
    </filter>
    <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="4" result="soft"/>
      <feColorMatrix in="soft" type="matrix"
        values="0 0 0 0 0.62  0 0 0 0 0.52  0 0 0 0 0.38  0 0 0 0.4 -0.14"/>
    </filter>
  </defs>

  <rect width="215.9" height="279.4" fill="#EDE6D8"/>
  <rect width="215.9" height="279.4" filter="url(#mottle)" opacity="0.35"/>
  <rect width="215.9" height="279.4" filter="url(#grain)" opacity="0.3"/>

  <path id="frame" fill="#DCE3DD" stroke="#244F33" stroke-width="1.9" stroke-linejoin="round"/>
</svg>

<script>
// ---- Colors ----
const PANEL = "#DCE3DD";   // inside of the page (pale sage)
const LINE  = "#244F33";   // wavy border

// ---- Border shape, in millimeters on a 215.9 x 279.4 page ----
const SHAPE = {
  left: 20.7, top: 19.85, right: 195.15, bottom: 259.5, // center line of the border
  corner: 4.9,        // corner radius
  height: 3.5,        // wave height (crest to center)
  topWaves: 9,        // number of full waves along the top and the bottom edges
  sideWaves: 9        // number of full waves along the left and right edges
};

function buildPath(s) {
  const pts = [];
  const step = 0.3;
  const smooth = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  // One straight edge with a sine wave pushed along the normal (nx, ny).
  // The wave fades out near both ends so the corners stay round and smooth.
  const edge = (ax, ay, bx, by, count, nx, ny) => {
    const len = Math.hypot(bx - ax, by - ay);
    const wave = len / count;
    const taper = wave / 3;
    const n = Math.max(2, Math.floor(len / step));
    for (let i = 0; i <= n; i++) {
      const t = (len * i) / n;
      const d = s.height * Math.sin((2 * Math.PI * t) / wave) * smooth(t / taper) * smooth((len - t) / taper);
      pts.push([ax + ((bx - ax) * i) / n + nx * d, ay + ((by - ay) * i) / n + ny * d]);
    }
  };
  const arc = (cx, cy, a0, a1) => {
    const n = Math.max(3, Math.floor((Math.abs(a1 - a0) * s.corner) / step));
    for (let i = 1; i < n; i++) {
      const a = a0 + ((a1 - a0) * i) / n;
      pts.push([cx + s.corner * Math.cos(a), cy + s.corner * Math.sin(a)]);
    }
  };
  const R = s.corner, P = Math.PI;
  edge(s.left + R, s.top, s.right - R, s.top, s.topWaves, 0, 1);
  arc(s.right - R, s.top + R, -P / 2, 0);
  edge(s.right, s.top + R, s.right, s.bottom - R, s.sideWaves, -1, 0);
  arc(s.right - R, s.bottom - R, 0, P / 2);
  edge(s.right - R, s.bottom, s.left + R, s.bottom, s.topWaves, 0, -1);
  arc(s.left + R, s.bottom - R, P / 2, P);
  edge(s.left, s.bottom - R, s.left, s.top + R, s.sideWaves, 1, 0);
  arc(s.left + R, s.top + R, P, 1.5 * P);
  return "M" + pts.map((p) => p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" L") + " Z";
}

const frame = document.getElementById("frame");
frame.setAttribute("d", buildPath(SHAPE));
frame.setAttribute("fill", PANEL);
frame.setAttribute("stroke", LINE);

// Add #trees to the address to get the Good to know version: watercolor trees inside the border.
const MIST = 0.3; // how much white mist covers the trees (0 = none, 1 = solid)
window.BG_READY = Promise.resolve();
if (location.hash === "#trees") {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("bg");
  const d = frame.getAttribute("d");
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const clip = mk("clipPath", { id: "treeclip" });
  clip.appendChild(mk("path", { d: d }));
  svg.querySelector("defs").appendChild(clip);
  const g = mk("g", { "clip-path": "url(#treeclip)" });
  g.appendChild(mk("rect", { width: "215.9", height: "279.4", fill: "#F4F7F6" }));
  g.appendChild(mk("image", { href: "../assets/imgs/trees.webp", x: "0", y: "0", width: "215.9", height: "279.4", preserveAspectRatio: "xMidYMid slice" }));
  g.appendChild(mk("rect", { width: "215.9", height: "279.4", fill: "#F4F7F6", "fill-opacity": MIST }));
  svg.appendChild(g);
  svg.appendChild(mk("path", { d: d, fill: "none", stroke: LINE, "stroke-width": "1.9", "stroke-linejoin": "round" }));
  window.BG_READY = new Promise((res) => { const im = new Image(); im.onload = im.onerror = res; im.src = "../assets/imgs/trees.webp"; });
}
</script>
</body>
</html>
