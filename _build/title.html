<!doctype html>
<!--
  Title badge for the "Good to know" page: kraft fill, wavy green outline, dark Josefin text.
  _build/render_assets.py saves this as assets/imgs/cards/gtk_title.png (transparent corners).
  Change TEXT, the colors, or SHAPE below to restyle it.
-->
<html lang="en"><head><meta charset="utf-8"><title>Good to know title</title>
<style>
@font-face{font-family:"Josefin Sans";src:url("../assets/fonts/josefin-sans.ttf") format("truetype");font-weight:100 700}
html,body{margin:0;background:transparent}
#badge{position:relative;width:1000px;height:212px}
#badge svg{position:absolute;inset:0}
#text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Josefin Sans",sans-serif;font-weight:700;font-size:76px;letter-spacing:.16em;padding-left:.16em;
  text-transform:uppercase;color:#1F2D2B}
</style></head><body>
<div id="badge">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 212" width="1000" height="212"><path id="shape"/></svg>
  <div id="text"></div>
</div>
<script>
const TEXT = "Good to know";
const FILL = "#E8E1D0";   // kraft
const LINE = "#244F33";   // wavy outline
const SHAPE = { left: 20, top: 20, right: 980, bottom: 192, corner: 36, height: 11, topWaves: 8, sideWaves: 2, stroke: 7 };

function buildPath(s) {
  const pts = [], step = 3;
  const smooth = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  const edge = (ax, ay, bx, by, count, nx, ny) => {
    const len = Math.hypot(bx - ax, by - ay), wave = len / count, taper = wave / 3;
    const n = Math.max(2, Math.floor(len / step));
    for (let i = 0; i <= n; i++) {
      const t = (len * i) / n;
      const d = s.height * Math.sin((2 * Math.PI * t) / wave) * smooth(t / taper) * smooth((len - t) / taper);
      pts.push([ax + ((bx - ax) * i) / n + nx * d, ay + ((by - ay) * i) / n + ny * d]);
    }
  };
  const arc = (cx, cy, a0, a1) => {
    const n = Math.max(3, Math.floor((Math.abs(a1 - a0) * s.corner) / step));
    for (let i = 1; i < n; i++) { const a = a0 + ((a1 - a0) * i) / n; pts.push([cx + s.corner * Math.cos(a), cy + s.corner * Math.sin(a)]); }
  };
  const R = s.corner, P = Math.PI;
  edge(s.left + R, s.top, s.right - R, s.top, s.topWaves, 0, 1);
  arc(s.right - R, s.top + R, -P / 2, 0);
  edge(s.right, s.top + R, s.right, s.bottom - R, s.sideWaves, -1, 0);
  arc(s.right - R, s.bottom - R, 0, P / 2);
  edge(s.right - R, s.bottom, s.left + R, s.bottom, s.topWaves, 0, -1);
  arc(s.left + R, s.bottom - R, P / 2, P);
  edge(s.left, s.bottom - R, s.left, s.top + R, s.sideWaves, 1, 0);
  arc(s.left + R, s.top + R, P, 1.5 * P);
  return "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + " Z";
}
const shape = document.getElementById("shape");
shape.setAttribute("d", buildPath(SHAPE));
shape.setAttribute("fill", FILL);
shape.setAttribute("stroke", LINE);
shape.setAttribute("stroke-width", SHAPE.stroke);
shape.setAttribute("stroke-linejoin", "round");
document.getElementById("text").textContent = TEXT;
window.TITLE_READY = document.fonts.ready;
</script></body></html>
