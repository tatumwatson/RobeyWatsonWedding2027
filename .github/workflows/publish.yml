name: Render and deploy wedding site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate QR code
        run: |
          pip install qrcode[pil]
          python3 -c "
          import os, qrcode
          os.makedirs('images', exist_ok=True)
          img = qrcode.make('https://tatumwatson.github.io/RobeyWatsonWedding2027/')
          img.save('images/wedding-qr-code.png')
          "

      - name: Commit QR code if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/wedding-qr-code.png
          if git diff --cached --quiet; then
            echo "QR code unchanged, nothing to commit"
          else
            git commit -m "Auto-update QR code"
            git push
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
